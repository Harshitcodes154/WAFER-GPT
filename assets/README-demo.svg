<svg width="1200" height="420"
viewBox="0 0 1200 420"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="100%" stop-color="#082f49"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="6"
  result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<rect width="1200"
height="420"
rx="25"
fill="url(#bg)"/>

<!-- LEFT -->

<text x="300"
y="55"
text-anchor="middle"
font-family="Arial"
font-size="24"
font-weight="bold"
fill="white">

MODEL PREDICTION

</text>

<circle cx="300"
cy="210"
r="125"
fill="#020617"
stroke="#22d3ee"
stroke-width="3"/>

<circle cx="300"
cy="210"
r="90"
fill="none"
stroke="#164e63"
stroke-width="2"/>

<circle cx="250"
cy="180"
r="9"
fill="#ef4444"
filter="url(#glow)"/>

<circle cx="340"
cy="230"
r="7"
fill="#ef4444"
filter="url(#glow)"/>

<circle cx="350"
cy="160"
r="6"
fill="#ef4444"
filter="url(#glow)"/>

<text x="300"
y="370"
text-anchor="middle"
font-family="Arial"
font-size="20"
fill="#67e8f9">

SCRATCH • 91.42%

</text>

<!-- ARROW -->

<path d="M440 210H540"
stroke="#22d3ee"
stroke-width="5"/>

<polygon points="540,210 520,198 520,222"
fill="#22d3ee"/>

<!-- RIGHT -->

<text x="850"
y="55"
text-anchor="middle"
font-family="Arial"
font-size="24"
font-weight="bold"
fill="white">

GRAD-CAM EXPLANATION

</text>

<circle cx="850"
cy="210"
r="125"
fill="#020617"
stroke="#a78bfa"
stroke-width="3"/>

<!-- HEATMAP -->

<circle cx="850"
cy="210"
r="90"
fill="none"
stroke="#334155"
stroke-width="3"/>

<ellipse cx="810"
cy="185"
rx="55"
ry="30"
fill="#ef4444"
opacity=".55"
filter="url(#glow)"/>

<ellipse cx="885"
cy="240"
rx="45"
ry="25"
fill="#f97316"
opacity=".5"
filter="url(#glow)"/>

<circle cx="900"
cy="160"
r="20"
fill="#facc15"
opacity=".7"
filter="url(#glow)"/>

<text x="850"
y="370"
text-anchor="middle"
font-family="Arial"
font-size="20"
fill="#c4b5fd">

MODEL ATTENTION MAP

</text>

<!-- PULSE -->

<circle cx="850"
cy="210"
r="125"
fill="none"
stroke="#a78bfa"
stroke-width="2"
opacity=".5">

<animate attributeName="r"
values="125;145;125"
dur="2s"
repeatCount="indefinite"/>

<animate attributeName="opacity"
values=".5;0;.5"
dur="2s"
repeatCount="indefinite"/>

</circle>

</svg>
