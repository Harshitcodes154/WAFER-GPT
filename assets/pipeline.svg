<svg width="1200" height="360"
viewBox="0 0 1200 360"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" x2="1">
  <stop offset="0%" stop-color="#020617"/>
  <stop offset="50%" stop-color="#082f49"/>
  <stop offset="100%" stop-color="#020617"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<rect width="1200" height="360" rx="25"
fill="url(#bg)"/>

<!-- TITLE -->

<text x="600"
y="50"
text-anchor="middle"
font-family="Arial"
font-size="28"
font-weight="bold"
fill="white">

AI ANALYSIS PIPELINE

</text>

<!-- CONNECTION LINE -->

<path d="M140 180H1060"
stroke="#164e63"
stroke-width="5"/>

<!-- MOVING ENERGY -->

<circle r="7"
fill="#22d3ee"
filter="url(#glow)">

<animateMotion
path="M140 180H1060"
dur="4s"
repeatCount="indefinite"/>

</circle>

<!-- NODE FUNCTION -->

<g font-family="Arial"
text-anchor="middle">

<!-- IMAGE -->

<circle cx="140" cy="180" r="55"
fill="#020617"
stroke="#22d3ee"
stroke-width="3"/>

<text x="140" y="175"
font-size="30">◉</text>

<text x="140" y="265"
font-size="18"
fill="white">

WAFER IMAGE

</text>

<!-- CNN -->

<circle cx="370" cy="180" r="55"
fill="#020617"
stroke="#38bdf8"
stroke-width="3"/>

<text x="370" y="175"
font-size="25"
fill="#67e8f9">

CNN

</text>

<text x="370" y="265"
font-size="18"
fill="white">

CLASSIFY

</text>

<!-- GRADCAM -->

<circle cx="600" cy="180" r="55"
fill="#020617"
stroke="#a78bfa"
stroke-width="3"/>

<text x="600" y="175"
font-size="21"
fill="#c4b5fd">

🔥

</text>

<text x="600" y="265"
font-size="18"
fill="white">

GRAD-CAM

</text>

<!-- GEMINI -->

<circle cx="830" cy="180" r="55"
fill="#020617"
stroke="#60a5fa"
stroke-width="3"/>

<text x="830" y="175"
font-size="19"
fill="#93c5fd">

AI

</text>

<text x="830" y="265"
font-size="18"
fill="white">

GEMINI

</text>

<!-- CHAT -->

<circle cx="1060" cy="180" r="55"
fill="#020617"
stroke="#22d3ee"
stroke-width="3"/>

<text x="1060" y="175"
font-size="25"
fill="#67e8f9">

💬

</text>

<text x="1060" y="265"
font-size="18"
fill="white">

WAFERGPT CHAT

</text>

</g>

</svg>
